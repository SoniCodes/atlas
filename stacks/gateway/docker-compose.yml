services:
  gateway:
    build: .
    image: atlas/gateway:dev
    container_name: gateway
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8000
    networks:
      - default
      - ollama_default
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3-vl-atlas:latest

networks:
  ollama_default:
    external: true
