- name: Create drop-in for apt-daily
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily.service.d
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Debian"

- name: Time out apt-daily instead of hanging forever.
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily.service.d/timeout.conf
    src: timeout.conf
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"
  notify: Reload systemd
