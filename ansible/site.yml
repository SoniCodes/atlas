- name: Baseline for every homelab machine
  hosts: homelab
  become: true
  tasks:
    - name: set timezone to UTC
      community.general.timezone:
        name: Etc/UTC

    - name: Install baseline troubleshooting tools
      ansible.builtin.package:
        name:
          - curl
          - htop
          - git
          - jq
        state: present

    - name: Install dig (Debian family)
      ansible.builtin.package:
        name: dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install dig (Red hat family)
      ansible.builtin.package:
        name: bind-utils
        state: present
      when: ansible_facts['os_family'] == "RedHat"
