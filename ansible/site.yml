- name: Baseline for every homelab machine
  hosts: homelab
  become: true
  tasks:
    - name: set timezone to UTC
      community.general.timezone:
        name: Etc/UTC

    - name: Install baseline troubleshooting tools
      ansible.builtin.package:
        name:
          - curl
          - htop
          - git
          - jq
        state: present

    - name: Install dig (Debian family)
      ansible.builtin.package:
        name: dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install dig (Red hat family)
      ansible.builtin.package:
        name: bind-utils
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Create drop-in directory for apt-daily
      ansible.builtin.file:
        path: /etc/systemd/system/apt-daily.service.d
        state: directory
        mode: "0755"
      when: ansible_facts['os_family'] == "Debian"

    - name: Time out apt-daily instead of hanging forever.
      ansible.builtin.copy:
        dest: /etc/systemd/system/apt-daily.service.d/timeout.conf
        content: |
          [Service]
          TimeoutStartSec=1h
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"
      notify: Reload systemd

    - name: Keep the atlas repo current on every node
      ansible.builtin.git:
        repo: git@github.com:SoniCodes/atlas.git
        dest: /home/vraj/atlas
        version: main
      become: false

    - name: Harden ssh (key-only login)
      ansible.builtin.copy:
        src: ../security/01-hardening.conf
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: 
        - Reload sshd (Debian)
        - Reload sshd (RedHat)

    - name: Keep the NVIDIA driver out of automatic upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-atlas-nvidia-blacklist
        content: |
          // Managed by Ansible. NVIDIA driver upgrades only happen through
          // patch.yml, which reboots and verifies the GPU afterward.
          Unattended-Upgrade::Package-Blacklist {
              "nvidia-";
              "libnvidia-";
              "xserver-xorg-video-nvidia-";
          };
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"
      
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reload sshd (Debian)
      ansible.builtin.systemd_service: 
        name: ssh
        state: reloaded
      when: ansible_facts['os_family'] == "Debian"

    - name: Reload sshd (RedHat)
      ansible.builtin.systemd_service:
          name: sshd 
          state: reloaded
      when: ansible_facts['os_family'] == "RedHat"

