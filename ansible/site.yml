- name: Baseline for every homelab machine
  hosts: homelab
  become: true
  roles:
    - ssh_hardening
    - apt_daily_timeout
  tasks:
    - name: set timezone to UTC
      community.general.timezone:
        name: Etc/UTC

    - name: Install baseline troubleshooting tools
      ansible.builtin.package:
        name:
          - curl
          - htop
          - git
          - jq
        state: present

    - name: Install dig (Debian family)
      ansible.builtin.package:
        name: dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install dig (Red hat family)
      ansible.builtin.package:
        name: bind-utils
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Keep the atlas repo current on every node
      ansible.builtin.git:
        repo: git@github.com:SoniCodes/atlas.git
        dest: /home/vraj/atlas
        version: main
      become: false

    - name: Keep the NVIDIA driver out of automatic upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-atlas-nvidia-blacklist
        content: |
          // Managed by Ansible. NVIDIA driver upgrades only happen through
          // patch.yml, which reboots and verifies the GPU afterward.
          Unattended-Upgrade::Package-Blacklist {
              "nvidia-";
              "libnvidia-";
              "xserver-xorg-video-nvidia-";
          };
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"
