- name: Patch hosts one at a time
  hosts: homelab
  become: true
  serial: 1
  tasks:
    - name: Upgrade all packages (Debian)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Upgrade all packages (RedHat)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_facts['os_family'] == "RedHat"

    - name: Check if a reboot is needed (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag
      when: ansible_facts['os_family'] == "Debian"

    - name: Check if a reboot is needed (RedHat)
      ansible.builtin.command: dnf needs-restarting -r
      register: needs_restart
      changed_when: false
      failed_when: needs_restart.rc not in [0,1]
      check_mode: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Reboot is needed (Debian)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - ansible_facts['os_family'] == "Debian"
        - reboot_flag.stat.exists

    - name: Reboot if needed (RedHat)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - ansible_facts['os_family'] == "RedHat"
        - needs_restart.rc == 1
