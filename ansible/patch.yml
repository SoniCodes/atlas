- name: Patch hosts one at a time
  hosts: homelab
  become: true
  serial: 1
  vars:
    atlas_containers: 
      - postgres
      - jenkins
      - gateway
      - nvidia-exporter
      - ollama
      - node-exporter
  tasks:
    - name: Upgrade all packages (Debian)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Upgrade all packages (RedHat)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_facts['os_family'] == "RedHat"

    - name: Check if a reboot is needed (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag
      when: ansible_facts['os_family'] == "Debian"

    - name: Check if a reboot is needed (RedHat)
      ansible.builtin.command: dnf needs-restarting -r
      register: needs_restart
      changed_when: false
      failed_when: needs_restart.rc not in [0,1]
      check_mode: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Reboot if needed (Debian)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - ansible_facts['os_family'] == "Debian"
        - reboot_flag.stat.exists

    - name: Reboot if needed (RedHat)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - ansible_facts['os_family'] == "RedHat"
        - needs_restart.rc == 1

    - name: Verify the GPU works inside a container (atlas)
      ansible.builtin.command: docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
      changed_when: false
      check_mode: false
      when: inventory_hostname == "atlas"

    - name: Verify expected containers are running (atlas)
      ansible.builtin.command: docker ps --quiet --filter name={{ item }} --filter status=running
      loop: "{{ atlas_containers }}"
      register: container_check
      until: container_check.stdout != ""
      retries: 10
      delay: 6
      changed_when: false
      check_mode: false
      when: inventory_hostname == "atlas"

    - name: Verify Prometheus is ready (macnode)
      ansible.builtin.uri:
        url: http://localhost:9090/-/ready
      register: prom_ready
      until: prom_ready.status == 200
      retries: 10
      delay: 6
      check_mode: false
      when: inventory_hostname == "macnode"

    - name: Verify Grafana is healthy (macnode)
      ansible.builtin.uri:
        url: http://localhost:3000/api/health
      register: grafana_health
      until: grafana_health.status == 0
      retries: 10
      delay: 6
      check_mode: false
      when: inventory_hostname == "macnode"


